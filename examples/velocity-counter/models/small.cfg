\* Bounded safety model. Same constants as the Osprey velocity-counter check:
\* MaxEvents=2, Retention=2, MaxNow=4. Liveness (FairSpec, Completion) stays
\* in the module and is not an INVARIANT, so it is outside this contract.

SPECIFICATION Spec

CONSTANTS
  MaxEvents = 2
  Retention = 2
  MaxNow = 4

INVARIANT TypeOK
INVARIANT RouteShape
INVARIANT OnlyRouted
INVARIANT RecordedAgrees
INVARIANT WindowBoundary
INVARIANT ExpiredNotCounted
INVARIANT CountMatches

CHECK_DEADLOCK TRUE
