name: coverage

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install -r requirements.txt
      - name: Test the checker
        run: python -m unittest tests/test_check_coverage.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the example contract and run TLC
        run: python scripts/check_coverage.py --mapping examples/velocity-counter/spec_coverage.yaml --tlc
